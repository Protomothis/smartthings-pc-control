name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          # setup-go's built-in cache keys only on go.sum and, because GitHub
          # caches are immutable per key, it would save the compiled Fyne/cgo
          # build cache once and never refresh it as sources change. The explicit
          # actions/cache step below keys on go.sum + *.go so every CI run stores
          # a current build cache and tag builds restore it via restore-keys.
          # Disabling it here also avoids downloading/uploading the module
          # cache twice.
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          # Must match ci.yml so a tag build reuses the cache CI warmed on develop/main.
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Build
        env:
          CGO_ENABLED: 1 # Fyne (GUI) requires cgo; windows-latest ships MinGW gcc
        run: go build -ldflags="-s -w -H=windowsgui -X main.Version=${{ github.ref_name }}" -o smartthings-pc-control.exe .

      # Signed update manifest (#66): the app only auto-updates from a
      # release whose update.json verifies against the ed25519 public key
      # embedded in internal/release. The seed lives solely in the
      # UPDATE_SIGNING_KEY secret; env: keeps it off the command line.
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./internal/tools/signmanifest sign -key env:UPDATE_SIGNING_KEY -version ${{ github.ref_name }} -arch amd64 -out update.json smartthings-pc-control.exe

      # Fails the build when the secret does not match the embedded public
      # key (e.g. after a key rotation that touched only one side).
      - name: Verify update manifest against embedded key
        run: go run ./internal/tools/signmanifest verify update.json update.json.sig

      - name: Extract release notes
        id: notes
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$tag\].*?(?=## \[|$)"
          $match = [regex]::Match($content, $pattern)
          $match.Value | Out-File -FilePath release_notes.txt -Encoding utf8
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smartthings-pc-control.exe
            update.json
            update.json.sig
          body_path: release_notes.txt
          generate_release_notes: true
