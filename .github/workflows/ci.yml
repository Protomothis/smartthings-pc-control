name: CI

# Runs gofmt, vet, test, the same cgo build as the release workflow and
# golangci-lint on every push to main and the milestone/* integration
# branches, and on pull requests to main. The weekly -race run is race.yml.
# Besides catching regressions early, this keeps the Go build/module
# cache warm so a later v* tag build (release.yml) restores it instead of
# compiling Fyne + cgo from scratch (~8 min cold).
on:
  push:
    branches:
      - main
      - 'milestone/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          # Disabled in favour of the explicit actions/cache step below; see
          # release.yml for the reasoning (setup-go keys on go.sum only).
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          # Same key scheme as release.yml so tag builds hit what CI saved.
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      # Cheap, so it runs first. .gitattributes pins *.go to LF, so a CRLF
      # checkout cannot make every file look unformatted.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l reports unformatted files (run gofmt -w on them):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        env:
          CGO_ENABLED: 1
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: 1 # Fyne (GUI) requires cgo; windows-latest ships MinGW gcc
        # Identical compile flags to release.yml so the build cache is reusable.
        # Only the -X Version string differs, and that affects linking alone.
        run: go build -ldflags="-s -w -H=windowsgui -X main.Version=ci-${{ github.sha }}" -o smartthings-pc-control.exe .

      # After the build so the type-check reuses the warm Fyne/cgo build cache
      # instead of compiling it again. Linters and their exclusions are in
      # .golangci.yml. The version is pinned: a new golangci-lint release can
      # add checks, and that should be a deliberate bump, not a red CI run.
      # It must be built with a Go at least as new as go.mod's (1.26).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: 1
        with:
          version: v2.14.0
