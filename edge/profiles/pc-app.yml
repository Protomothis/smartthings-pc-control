# The app child device (#123, design doc §4.2). Hand-written: it is not part of
# the iconStyle/battery matrix tools/gen-profiles.js makes for the PC.
#
# One child per entry of the PC's watch list, created by the driver with
# `driver:try_create_device{ type = "EDGE_CHILD", parent_assigned_child_key =
# <process name>, profile = "pc-app.v1", … }`. Its one row says whether that
# app runs ("실행 중 (Running)" / "꺼짐 (Stopped)"), on the dashboard tile, the
# detail view and as a routine condition. `refresh` asks the parent PC.
#
# No preferences: everything about the connection belongs to the parent.
# A new presentation is a new name (pc-app.v2, platform notes "프로필과 화면
# 생성"); this file then stays for the children still on v1.
name: pc-app.v1
components:
  - id: main
    capabilities:
      - id: numbersystem53811.pcapp
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Others
