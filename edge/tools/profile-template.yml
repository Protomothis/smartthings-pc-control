# The ONE hand-written device profile (design doc §6.6, media-notify.md §14).
#
# tools/gen-profiles.js turns this file into the twenty current profiles in
# profiles/: every `iconStyle` value (#100, the category the app draws the icon
# from) with and without the battery component (#116). Edit this file, run
#
#   bun tools/gen-profiles.js          (or: node tools/gen-profiles.js)
#
# and commit the regenerated files with it; tests/profilegen_test.lua fails
# while a file in profiles/ differs from what this template makes. The
# placeholders are filled per profile:
#
#   __NAME__       the profile name - pc.v8, pc-tv.v8, pc-battery.v8, pc-tv-battery.v8
#   __CATEGORY__   the main component's category (profiles.CATEGORIES)
#   @battery-begin … @battery-end
#                  kept only in the -battery profiles; the marker lines go
#   @media-begin … @media-end, @media-component
#                  #118: the media group. By default it stays where it is, in
#                  main, and the three marker lines go. With
#                  `gen-profiles.js --media-component` the group leaves main
#                  and becomes a component `media` (label 미디어) at the
#                  @media-component line - an alternative layout for a Dev
#                  channel comparison, not for committing (the sync test
#                  checks the default).
#
# This file lives in tools/, not in profiles/, on purpose: the packager takes
# every YAML file in profiles/ as a profile, and a template there would be a
# twenty-first one with a placeholder for a name. The published older
# generation stays in profiles/, frozen, for the devices not yet migrated: the
# v1 files (pc.yml and pc-<style>.yml). The v2 to v7 files this template made
# were never published and are gone (profiles.UNSHIPPED_VERSIONS). So is the
# app child's hand-written pc-app.yml (#123): the watch card replaced it.
#
# The capability ORDER below is the reading order on screen: the app collects
# every state-only row of our own capabilities into one card and every
# interactive row into a second one, and follows this list inside each card.
# `pcVersion` closes the edge-v1.0 set, with `pcInfo` right above it, so the
# version row ends the status card. The v1.2.0 capabilities follow it, in the
# order of media-notify.md §15 "UI 구성": the media group first, then the rest.
# It is also why `pcVersion` is a capability of its own: two state rows of one
# capability are drawn side by side and truncated (platform notes "화면 배치").
#
# The `numbersystem53811` namespace is the one SmartThings assigned to the
# owner account (platform notes "capability id와 네임스페이스"). Keep it in sync
# with `NAMESPACE` in src/caps.lua - tools/apply-namespace.js rewrites both.
#
# Preference titles and descriptions are Korean first with the English term in
# parentheses: the SmartThings app shows profile preferences in whatever the
# driver wrote, with no per-locale variant, and this project is Korean-first.
# Keep descriptions to a sentence or two: each is copied into twenty profiles,
# and the package has a size limit. Comment lines like these are not copied.
name: __NAME__
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
      - id: numbersystem53811.pcpower
        version: 1
      - id: numbersystem53811.pcremote
        version: 1
      - id: numbersystem53811.pcdefer
        version: 1
      - id: numbersystem53811.pcuser
        version: 1
      - id: numbersystem53811.pcinfo
        version: 1
      - id: numbersystem53811.pcversion
        version: 1
      # #107/#118: the media group - what is playing, play/pause, previous/
      # next, the volume slider and the mute toggle. Standard capabilities,
      # drawn by the app itself. `--media-component` moves these lines into
      # the `media` component below instead.
# @media-begin
      - id: audioTrackData
        version: 1
      - id: mediaPlayback
        version: 1
      - id: mediaTrackControl
        version: 1
      - id: audioVolume
        version: 1
      - id: audioMute
        version: 1
# @media-end
      # #113: the preset list and the names row.
      - id: numbersystem53811.pcpreset
        version: 1
      # #108: "PC에 메시지 보내기" - one text field on the detail view and in
      # the routine actions. Our own capability: the standard `notification`
      # showed Samsung's label ("텍스트 표시"), which a device configuration
      # cannot override (platform notes "표준 capability"). The field is bound
      # to `lastMessage` (the last text sent): a row bound to no attribute
      # never gets the event the app waits for and ends in "네트워크 오류".
      - id: numbersystem53811.pctoast
        version: 1
    categories:
      - name: __CATEGORY__
# @media-component
  # #123: the watch card - what runs on the PC (the opt-in watch list): a
  # summary row ("Steam 실행 중 · 외 1개"), the names row ("1 Steam · 3 OBS")
  # and one state per slot, which a routine reads as "감시 1".."감시 5". A
  # component of its own so the card is one card, under the PC device where
  # a user looks for it (platform notes "자식 장치 대신 슬롯").
  - id: apps
    label: 감시 목록
    capabilities:
      - id: numbersystem53811.pcwatch
        version: 1
  # #115: keep-awake. A standard switch of its own, so a routine can use it as
  # an action and as a condition like any other switch; it cannot be the main
  # component's, which is the PC's power.
  - id: awake
    label: 잠들지 않기
    capabilities:
      - id: switch
        version: 1
# @battery-begin
  - id: battery
    label: 배터리
    capabilities:
      - id: battery
        version: 1
      - id: powerSource
        version: 1
# @battery-end
preferences:
  - name: ipAddress
    title: PC IP 주소 (IP address)
    description: "PC의 IPv4 주소(예: 192.168.1.20). 비우면 SSDP로 찾은 주소를 씁니다. / PC IPv4; empty = SSDP."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 45
      default: ""
  - name: followDiscovery
    title: 검색 따라가기 (Follow discovery)
    description: "SSDP가 알려 온 새 주소를 따라갑니다. IP 주소를 채우면 그 값이 우선합니다. / Follow the PC via SSDP."
    required: false
    preferenceType: boolean
    definition:
      default: true
  - name: port
    title: 서비스 포트 (Service port)
    description: "서비스 명령 포트(기본 5001). / Service port."
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 5001
  - name: secret
    title: 시크릿 (Secret)
    description: "PC Control 설정 탭의 시크릿. 입력 중 화면에 보입니다. / Shared secret; visible while typing."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 64
      default: ""
  - name: macAddress
    title: MAC 주소 (MAC address)
    description: "WoL용 MAC(예: AA:BB:CC:DD:EE:FF). 비우면 서비스가 고른 어댑터. / WoL MAC; empty = service pick."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 17
      default: ""
  - name: wolBroadcast
    title: WoL 브로드캐스트 (Broadcast)
    description: "매직 패킷을 보낼 주소. 막히면 서브넷 브로드캐스트(예: 192.168.1.255). / Magic packet target."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 45
      default: "255.255.255.255"
  - name: pollInterval
    title: 상태 확인 주기 (Poll interval)
    description: "PC에 상태를 묻는 주기. / Status poll interval."
    required: true
    preferenceType: enumeration
    definition:
      options:
        "10": 10초마다 (10 s)
        "30": 30초마다 (30 s)
        "60": 1분마다 (1 min)
        "300": 5분마다 (5 min)
      default: "30"
  - name: offAction
    title: 스위치 끄기 동작 (Off action)
    description: "스위치를 끌 때 보낼 명령. 강제 종료 외에는 PC의 유예를 따릅니다. / Command for switch off."
    required: true
    preferenceType: enumeration
    definition:
      options:
        shutdown: 종료 (Shut down)
        suspend: 절전 (Sleep)
        hibernate: 최대 절전 (Hibernate)
        lock: 잠금 (Lock)
        turnscreenoff: 화면 끄기 (Screen off)
        restart: 재시작 (Restart)
        forceshutdown: 강제 종료 (Force shutdown)
      default: shutdown
  - name: buttonMode
    title: 버튼 실행 방식 (Button mode)
    description: "명령 목록에서 고른 명령이 유예를 따를지. 유예 중에는 트레이에서 취소할 수 있습니다. / Grace for the command list."
    required: true
    preferenceType: enumeration
    definition:
      options:
        default: 설정된 유예 따름 (Grace)
        immediate: 즉시 실행 (Immediate)
      default: default
  - name: language
    title: 문구 언어 (Language)
    description: "상태 문구의 언어. 허브 로케일을 읽을 수 없어 자동은 한국어입니다. / Text language; auto = Korean."
    required: true
    preferenceType: enumeration
    definition:
      options:
        auto: 자동 (한국어)
        ko: 한국어 (Korean)
        en: English
      default: auto
  - name: iconStyle
    title: 아이콘 (Icon)
    description: "앱의 장치 아이콘. 바꿔도 장치를 다시 추가할 필요가 없습니다. / Device icon; no re-add needed."
    required: true
    preferenceType: enumeration
    definition:
      options:
        others: 기타 (Others)
        monitor: 모니터 (Monitor)
        switch: 스위치 (Switch)
        plug: 플러그 (Plug)
        tv: TV (Television)
        projector: 프로젝터 (Projector)
        network: 네트워크 (Network)
        hub: 허브 (Hub)
        theater: 홈시어터 (Home theater)
        remote: 리모컨 (Remote)
      default: others
  - name: awakeMinutes
    title: 잠들지 않기 시간 (Keep-awake min)
    description: "잠들지 않기를 켰을 때 유휴 절전을 막는 시간(분, 최대 1440). 0이면 끌 때까지. / Keep-awake minutes; 0 = until off."
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 1440
      default: 60
