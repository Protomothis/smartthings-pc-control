<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b95a1"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#191f28" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="28" fill="#f2f4f6"/>

  <!-- 왼쪽: 보내는 곳 -->
  <g filter="url(#s)">
    <rect x="32" y="56" width="220" height="112" rx="20" fill="#fff"/>
    <rect x="32" y="232" width="220" height="112" rx="20" fill="#fff"/>
  </g>
  <rect x="52" y="78" width="44" height="44" rx="12" fill="#e8f3ff"/>
  <rect x="66" y="86" width="16" height="28" rx="4" fill="none" stroke="#3182f6" stroke-width="2.5"/>
  <text x="108" y="98" font-size="17" font-weight="700" fill="#191f28">SmartThings app</text>
  <text x="108" y="120" font-size="13.5" fill="#6b7684">Buttons · routines</text>
  <text x="52" y="150" font-size="12.5" fill="#8b95a1">Works away from home too</text>

  <rect x="52" y="254" width="44" height="44" rx="12" fill="#e5f6ee"/>
  <path d="M63 276l22-9-6 22-5-8z" fill="#03a94d"/>
  <text x="108" y="274" font-size="17" font-weight="700" fill="#191f28">Telegram bot</text>
  <text x="108" y="296" font-size="13.5" fill="#6b7684">Optional</text>
  <text x="52" y="326" font-size="12.5" fill="#8b95a1">No open ports, no webhook</text>

  <!-- 가운데: 허브 -->
  <g filter="url(#s)">
    <rect x="352" y="56" width="236" height="112" rx="20" fill="#fff"/>
  </g>
  <rect x="372" y="78" width="44" height="44" rx="12" fill="#e5f6ee"/>
  <rect x="381" y="99" width="26" height="14" rx="4" fill="#03a94d"/>
  <circle cx="388" cy="106" r="1.8" fill="#fff"/><circle cx="394" cy="106" r="1.8" fill="#fff"/><circle cx="400" cy="106" r="1.8" fill="#fff"/>
  <path d="M388 93a9 9 0 0 1 12 0M385 89a14 14 0 0 1 18 0" fill="none" stroke="#03a94d" stroke-width="2.2" stroke-linecap="round"/>
  <text x="428" y="98" font-size="17" font-weight="700" fill="#191f28">SmartThings hub</text>
  <text x="428" y="120" font-size="13.5" fill="#6b7684">Edge driver</text>
  <text x="372" y="150" font-size="12.5" fill="#8b95a1">Runs locally at home</text>

  <!-- 오른쪽: 내 PC -->
  <rect x="680" y="40" width="248" height="320" rx="24" fill="#e8f3ff"/>
  <text x="700" y="70" font-size="14" font-weight="700" fill="#1b64da">Your Windows PC</text>
  <g filter="url(#s)">
    <rect x="696" y="86" width="216" height="112" rx="18" fill="#fff"/>
    <rect x="696" y="232" width="216" height="112" rx="18" fill="#fff"/>
  </g>
  <text x="716" y="118" font-size="16.5" font-weight="700" fill="#191f28">PC Control service</text>
  <text x="716" y="142" font-size="13.5" fill="#6b7684">Always on, no sign-in needed</text>
  <text x="716" y="176" font-size="12.5" fill="#8b95a1">Power · schedules · state</text>

  <text x="716" y="264" font-size="16.5" font-weight="700" fill="#191f28">Tray app</text>
  <text x="716" y="288" font-size="13.5" fill="#6b7684">On the signed-in desktop</text>
  <text x="716" y="322" font-size="12.5" fill="#8b95a1">Volume · media · presets</text>

  <!-- 화살표 -->
  <line x1="256" y1="112" x2="346" y2="112" stroke="#8b95a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="592" y1="112" x2="690" y2="132" stroke="#3182f6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="598" y="96" font-size="12.5" font-weight="600" fill="#3182f6">Same LAN</text>
  <text x="598" y="80" font-size="11.5" fill="#6b7684">Secret checked</text>
  <path d="M256 288C480 288 540 186 690 180" fill="none" stroke="#8b95a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="300" y="312" font-size="12" fill="#6b7684">Internet · the PC fetches commands from the bot</text>
  <line x1="804" y1="202" x2="804" y2="226" stroke="#3182f6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="814" y="219" font-size="11.5" fill="#1b64da">Desktop jobs</text>
</svg>
