  <text x="428" y="120" font-size="13.5" fill="#6b7684">Edge 드라이버</text>
  <text x="372" y="150" font-size="12.5" fill="#8b95a1">집 안에서 로컬로 실행</text>

  <!-- 오른쪽: 내 PC -->
  <rect x="680" y="40" width="248" height="320" rx="24" fill="#e8f3ff"/>
  <text x="700" y="70" font-size="14" font-weight="700" fill="#1b64da">내 Windows PC</text>
  <g filter="url(#s)">
    <rect x="696" y="86" width="216" height="112" rx="18" fill="#fff"/>
    <rect x="696" y="232" width="216" height="112" rx="18" fill="#fff"/>
  </g>
  <text x="716" y="118" font-size="16.5" font-weight="700" fill="#191f28">PC Control 서비스</text>
  <text x="716" y="142" font-size="13.5" fill="#6b7684">로그인 없이 항상 실행</text>
  <text x="716" y="176" font-size="12.5" fill="#8b95a1">전원 · 예약 · 상태 · 업데이트</text>

  <text x="716" y="264" font-size="16.5" font-weight="700" fill="#191f28">트레이 앱</text>
  <text x="716" y="288" font-size="13.5" fill="#6b7684">로그인한 사용자 화면</text>
  <text x="716" y="322" font-size="12.5" fill="#8b95a1">볼륨 · 미디어 · 알림 · 프리셋</text>

  <!-- 화살표 -->
  <line x1="256" y1="112" x2="346" y2="112" stroke="#8b95a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="592" y1="112" x2="690" y2="132" stroke="#3182f6" stroke-width="2.5" marker-end="url(#a)"/>
