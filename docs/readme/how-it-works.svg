  <path d="M256 288C480 288 540 186 690 180" fill="none" stroke="#8b95a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="300" y="312" font-size="12" fill="#6b7684">인터넷 · PC가 봇에서 명령을 가져와요</text>
  <line x1="804" y1="202" x2="804" y2="226" stroke="#3182f6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="814" y="219" font-size="11.5" fill="#1b64da">세션 작업 전달</text>
